# Default Options (BlayTheNinth), read via Balm's Forge config. Terrestrial Tribulations ships only this file, not options.txt,
# so a pack update never overwrites a player's own settings.
# defaultResourcePacks is applied once per instance (Default Options keeps a journal in config/defaultoptions/): it switches
# on Karambit Vault x Punchy, which our four karambits use for their 3D models and Punchy animations, and above it
# TT Karambits (generated by tools/build_content.py), which keeps vanilla swords vanilla. Below them, Pool and Billiards
# (tools/import_pool.py: cue sticks, balls and tables for the pool data pack in kubejs/data). Order matters: last = top.
# A player who turns them off in Options -> Resource Packs keeps them off.
# config/defaultoptions/options.txt holds lighter first-run video settings (render distance 10, simulation 6, entities 75%,
# particles Decreased, fast clouds). Default Options copies it only when the instance has no options.txt yet.

#The default difficulty selected for newly created worlds.
#Allowed Values: PEACEFUL, EASY, NORMAL, HARD
defaultDifficulty = "NORMAL"
#Set to true if the difficulty for new world's should be locked to the specific default. This cannot be unlocked by players without external tools! Probably a bad idea. I don't recommend. Why am I adding this option?
lockDifficulty = false
#Resource pack IDs to have enabled by default on the first run.
defaultResourcePacks = ["vanilla", "mod_resources", "file/Pool and Billiards", "file/Karambit Vault x Punchy.zip", "file/TT Karambits"]
