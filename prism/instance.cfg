[General]
ConfigVersion=1.2
InstanceType=OneSix
name=Terrestrial Tribulations (Test Build 1)
iconKey=default
notes=Terrestrial Tribulations Test Build 1. Mods download automatically on first launch (TT ModSync). See tt-sync/sync-report.txt after launching.
OverrideMemory=true
MinMemAlloc=4096
MaxMemAlloc=8192
OverrideJavaArgs=true
JvmArgs=-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20
OverrideCommands=true
PreLaunchCommand="$INST_JAVA" -jar "$INST_MC_DIR/tt-sync/ModSync.jar"
WrapperCommand=
PostExitCommand=
