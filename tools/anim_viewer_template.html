<meta charset="utf-8">
<title>Cast Animation Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Same bench as the weapon viewer: cast list on the left, the posing player in the middle, timing notes on the right. */
:root {
  --bg: #121118; --panel: #1A1922; --raise: #23212D; --line: #2E2B3B;
  --fg: #ECE9F4; --muted: #9A95AF; --accent: #E8A84A; --glow: #8FE3D6;
  --display: "Silkscreen", "Courier New", monospace;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; }
.app { height: 100%; display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; grid-template-rows: auto minmax(0, 1fr); }
header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); }
header h1 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0; letter-spacing: 0.04em; color: var(--accent); }
header p { margin: 0; color: var(--muted); font-size: 13px; }
.list { overflow-y: auto; border-right: 1px solid var(--line); padding: 10px 8px 10px max(8px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 2px; }
.list button { width: 100%; background: none; border: 1px solid transparent; color: var(--fg); font: 500 13px var(--mono); text-align: left; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.list button:hover { background: var(--raise); }
.list button[aria-current="true"] { background: var(--raise); border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.stage { position: relative; min-width: 0; min-height: 320px; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.controls { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.controls button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: 500 12px var(--body); cursor: pointer; }
.controls button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.timeline { flex: 1 1 160px; position: relative; height: 8px; background: var(--raise); border-radius: 4px; min-width: 120px; }
.timeline .fill { position: absolute; inset: 0 auto 0 0; background: var(--muted); border-radius: 4px; }
.timeline .rel { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--glow); }
.clock { font: 500 12px var(--mono); color: var(--muted); min-width: 64px; text-align: right; }
.notes { overflow-y: auto; border-left: 1px solid var(--line); padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px 16px; display: flex; flex-direction: column; gap: 12px; }
.notes h2 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0; line-height: 1.3; }
.notes p { margin: 0; line-height: 1.5; }
.notes .muted { color: var(--muted); font-size: 13px; }
.notes code { font-family: var(--mono); font-size: 12px; background: var(--raise); padding: 1px 5px; border-radius: 4px; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; font-size: 13px; }
dt { color: var(--muted); } dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(340px, 60vh) auto; height: auto; }
  .list { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 16px; }
  .list button { width: auto; white-space: nowrap; }
  .notes { border-left: 0; border-top: 1px solid var(--line); padding: 16px; }
}
</style>
<div class="app">
  <header><h1>Cast Animation Bench</h1><p>The pack's own <code>tt:</code> player animations, posed the way playerAnimator plays them. Drag to orbit.</p></header>
  <nav class="list" id="list" aria-label="Animations"></nav>
  <main class="stage" id="stage">
    <div class="controls">
      <button id="play" aria-pressed="true">Pause</button>
      <button id="slow" aria-pressed="false">Slow motion</button>
      <div class="timeline" aria-hidden="true"><div class="fill" id="fill"></div><div class="rel" id="rel"></div></div>
      <span class="clock" id="clock">0.00 s</span>
    </div>
  </main>
  <aside class="notes" id="notes"></aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const CASTS = /*__DATA__*/[];
const D2R = Math.PI / 180;
const EASE = {
  linear: f => f, step: () => 0,
  easeInSine: f => 1 - Math.cos(f * Math.PI / 2), easeOutSine: f => Math.sin(f * Math.PI / 2), easeInOutSine: f => -(Math.cos(Math.PI * f) - 1) / 2,
  easeInQuad: f => f * f, easeOutQuad: f => 1 - (1 - f) * (1 - f), easeInOutQuad: f => f < .5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2,
  easeInCubic: f => f * f * f, easeOutCubic: f => 1 - Math.pow(1 - f, 3), easeInOutCubic: f => f < .5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2,
  easeInExpo: f => f === 0 ? 0 : Math.pow(2, 10 * f - 10), easeOutExpo: f => f === 1 ? 1 : 1 - Math.pow(2, -10 * f),
  easeInBack: f => 2.70158 * f * f * f - 1.70158 * f * f, easeOutBack: f => 1 + 2.70158 * Math.pow(f - 1, 3) + 1.70158 * Math.pow(f - 1, 2),
};

// Rig in Minecraft model space (pixels, y down, the player faces -z). Pivots and boxes match the vanilla player model.
const PALETTE = { skin: 0xC69C7A, shirt: 0x3F6F8F, sleeve: 0x335C78, pants: 0x3B3552, hair: 0x3A2A1E, staff: 0x8A6A44, gem: 0x8FE3D6 };
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121118);
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 500);
camera.position.set(42, 18, 66);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 7, 0); controls.enableDamping = true; controls.minDistance = 20; controls.maxDistance = 140;
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x2a2533, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(20, 40, 30); scene.add(sun);
const grid = new THREE.GridHelper(64, 16, 0x2E2B3B, 0x22202B); grid.position.y = -12; scene.add(grid);

// world = MC space rotated 180 degrees about x (y up, player faces the camera)
const world = new THREE.Group(); world.rotation.x = Math.PI; world.position.y = 12; scene.add(world);
function box(color, x0, y0, z0, x1, y1, z1) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), new THREE.MeshLambertMaterial({ color }));
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); return m;
}
function part(parent, pivot, ...meshes) {
  const g = new THREE.Group(); g.rotation.order = "ZYX"; g.position.set(...pivot); g.userData.pivot = pivot;
  meshes.forEach(m => g.add(m)); parent.add(g); return g;
}
// "body" moves the whole player; "torso" bends the upper body about the hips.
const bodyG = part(world, [0, 0, 0]);
const torsoG = part(bodyG, [0, 12, 0]);
const upper = new THREE.Group(); upper.position.set(0, -12, 0); torsoG.add(upper);
upper.add(box(PALETTE.shirt, -4, 0, -2, 4, 12, 2));
const bones = {
  body: bodyG, torso: torsoG,
  head: part(upper, [0, 0, 0], box(PALETTE.skin, -4, -8, -4, 4, 0, 4), box(PALETTE.hair, -4.2, -8.2, -4.2, 4.2, -6, 4.2), box(PALETTE.hair, -4.2, -8, 2, 4.2, -2, 4.2)),
  right_arm: part(upper, [-5, 2, 0], box(PALETTE.sleeve, -3, -2, -2, 1, 5, 2), box(PALETTE.skin, -3, 5, -2, 1, 10, 2)),
  left_arm: part(upper, [5, 2, 0], box(PALETTE.sleeve, -1, -2, -2, 3, 5, 2), box(PALETTE.skin, -1, 5, -2, 3, 10, 2)),
  right_leg: part(bodyG, [-1.9, 12, 0], box(PALETTE.pants, -2, 0, -2, 2, 12, 2)),
  left_leg: part(bodyG, [1.9, 12, 0], box(PALETTE.pants, -2, 0, -2, 2, 12, 2)),
};
// a staff in the right hand, so the hand's direction reads clearly
const staff = new THREE.Group(); staff.position.set(-1, 9, 0); staff.rotation.x = Math.PI / 2; bones.right_arm.add(staff);
staff.add(box(PALETTE.staff, -0.5, -10, -0.5, 0.5, 6, 0.5));
const gem = box(PALETTE.gem, -1.2, -12.4, -1.2, 1.2, -10, 1.2); gem.material = new THREE.MeshBasicMaterial({ color: PALETTE.gem }); staff.add(gem);
// release flash
const flash = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 12), new THREE.MeshBasicMaterial({ color: PALETTE.gem, transparent: true, opacity: 0 }));
scene.add(flash);

function sample(track, t) {
  const keys = Object.keys(track).map(Number).sort((a, b) => a - b);
  if (t <= keys[0]) return track[fmt(keys[0], track)].vector;
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i]) {
      const a = track[fmt(keys[i - 1], track)], b = track[fmt(keys[i], track)];
      const f = (EASE[b.easing] || EASE.linear)((t - keys[i - 1]) / (keys[i] - keys[i - 1]));
      return a.vector.map((v, j) => v + (b.vector[j] - v) * f);
    }
  }
  return track[fmt(keys[keys.length - 1], track)].vector;
}
function fmt(n, track) { return Object.keys(track).find(k => Number(k) === n); }

function pose(cast, t) {
  for (const [name, g] of Object.entries(bones)) {
    const b = cast.bones[name], p = g.userData.pivot;
    const r = b && b.rotation ? sample(b.rotation, t) : [0, 0, 0];
    const o = b && b.position ? sample(b.position, t) : [0, 0, 0];
    g.rotation.set(r[0] * D2R, r[1] * D2R, r[2] * D2R);
    // playerAnimator: position y is flipped into model space (Bedrock y is up)
    g.position.set(p[0] + o[0], p[1] - o[1], p[2] + o[2]);
  }
}

let current = 0, t = 0, playing = true, slow = false, last = performance.now();
const list = document.getElementById("list"), notes = document.getElementById("notes");
CASTS.forEach((c, i) => {
  const b = document.createElement("button"); b.textContent = "tt:" + c.name;
  b.onclick = () => select(i); list.appendChild(b);
});
function select(i) {
  current = i; t = 0;
  [...list.children].forEach((b, j) => b.setAttribute("aria-current", j === i ? "true" : "false"));
  const c = CASTS[i];
  notes.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = c.name.replace(/_/g, " "); notes.appendChild(h);
  const p = document.createElement("p"); p.textContent = c.desc; notes.appendChild(p);
  const dl = document.createElement("dl");
  [["Length", (c.length * 20).toFixed(0) + " ticks (" + c.length + " s)"], ["Release", "tick " + c.release], ["Effect", c.style], ["ID", "tt:" + c.name]]
    .forEach(([k, v]) => { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.textContent = v; dl.append(dt, dd); });
  notes.appendChild(dl);
  const m = document.createElement("p"); m.className = "muted";
  m.textContent = "The teal mark on the timeline is the release tick, where the spell's effect fires. In game: /superpower add tt:cast_test, then use the ability keys.";
  notes.appendChild(m);
  document.getElementById("rel").style.left = (c.release / 20 / c.length * 100) + "%";
}
document.getElementById("play").onclick = e => { playing = !playing; e.target.textContent = playing ? "Pause" : "Play"; e.target.setAttribute("aria-pressed", playing); };
document.getElementById("slow").onclick = e => { slow = !slow; e.target.setAttribute("aria-pressed", slow); };

const HOLD = 0.6; // pause between loops so the return to rest reads
const handPos = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const c = CASTS[current];
  if (playing) t += dt * (slow ? 0.25 : 1);
  if (t > c.length + HOLD) t = 0;
  const tc = Math.min(t, c.length);
  pose(c, tc);
  const since = tc - c.release / 20;
  gem.getWorldPosition(handPos); flash.position.copy(handPos);
  flash.material.opacity = since >= 0 && since < 0.25 ? 0.7 * (1 - since / 0.25) : 0;
  flash.scale.setScalar(1 + Math.max(0, since) * 6);
  document.getElementById("fill").style.width = (tc / c.length * 100) + "%";
  document.getElementById("clock").textContent = tc.toFixed(2) + " s";
  controls.update();
  const w = stage.clientWidth, h = stage.clientHeight;
  if (renderer.domElement.width !== Math.floor(w * renderer.getPixelRatio())) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  renderer.domElement.style.width = w + "px"; renderer.domElement.style.height = h + "px";
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
select(0);
requestAnimationFrame(frame);
</script>
